<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="brand_base.css">
<style>
  .metric {
    font-size: 200px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--brand-accent);
    margin: 0;
  }
  .metric-label {
    font-size: 36px;
    font-weight: 600;
    line-height: 1.3;
    color: var(--brand-text);
    opacity: 0.85;
    margin: 24px 0 0 0;
    overflow-wrap: break-word;
    word-wrap: break-word;
  }
  .description {
    font-size: 32px;
    font-weight: 400;
    line-height: 1.4;
    color: rgba(255,255,255,0.75);
    max-width: 850px;
    margin: 32px 0 0 0;
    overflow-wrap: break-word;
    word-wrap: break-word;
  }
</style>
</head>
<body>
<div class="container">
  <div class="top">
    <div class="brand-row">
      <div class="brand-name">{{BRAND}}</div>
    </div>
    <div class="brand-rule"></div>
  </div>
  <div class="middle">
    <p class="metric">{{METRIC}}</p>
    <p class="metric-label">{{METRIC_LABEL}}</p>
    <p class="description">{{DESCRIPTION}}</p>
  </div>
  <div class="bottom">
    <div class="url-badge">
      <span class="brand-url">{{URL}}</span>
    </div>
  </div>
</div>
<script>
(function() {
  var d = document.querySelector('.description');
  if (d) {
    var len = (d.innerText || d.textContent || '').length;
    var size = 32;
    if (len > 80) size = 28;
    if (len > 120) size = 26;
    if (len > 200) size = 24;
    d.style.fontSize = size + 'px';
  }
  var m = document.querySelector('.metric');
  if (m) {
    var mlen = (m.innerText || m.textContent || '').length;
    if (mlen > 5) m.style.fontSize = '140px';
  }
  var l = document.querySelector('.metric-label');
  if (l) {
    var llen = (l.innerText || l.textContent || '').length;
    if (llen > 40) l.style.fontSize = '30px';
    if (llen > 80) l.style.fontSize = '26px';
  }
  try {
    if (window.innerHeight <= 700) {
      var c = document.querySelector('.container');
      if (c) { c.style.paddingTop = '60px'; c.style.paddingBottom = '60px'; }
      var b = document.querySelector('.bottom');
      if (b) { b.style.paddingTop = '20px'; }
      if (m) m.style.fontSize = '110px';
      if (l) l.style.fontSize = '24px';
      if (d) { d.style.fontSize = '20px'; d.style.marginTop = '20px'; }
    }
  } catch (e) {}
})();
</script>
</body>
</html>
