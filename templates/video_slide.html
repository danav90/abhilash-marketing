<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: {{BG_COLOR}};
    color: #FFFFFF;
    -webkit-font-smoothing: antialiased;
  }
  .slide {
    width: 1920px; height: 1080px;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 90px 140px;
    background: radial-gradient(circle at 85% 15%, rgba(255,255,255,0.06), transparent 45%), {{BG_COLOR}};
  }
  .brand-row {
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand-name { font-size: 34px; font-weight: 800; letter-spacing: 0.14em; color: {{ACCENT_COLOR}}; }
  .kicker { font-size: 26px; font-weight: 700; letter-spacing: 0.28em; color: rgba(255,255,255,0.55); text-transform: uppercase; }
  .rule { height: 2px; background: {{ACCENT_COLOR}}; opacity: 0.35; margin-top: 26px; }
  .middle { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .headline { font-size: 104px; font-weight: 800; line-height: 1.12; letter-spacing: -0.015em; max-width: 1600px; overflow-wrap: break-word; }
  .subtext { font-size: 44px; font-weight: 400; line-height: 1.4; color: rgba(255,255,255,0.78); max-width: 1500px; margin-top: 30px; overflow-wrap: break-word; }
  .body { margin-top: 36px; }
  .pill { display: inline-block; font-size: 34px; font-weight: 700; border: 2px solid rgba(255,255,255,0.3); border-radius: 999px; padding: 12px 34px; margin: 0 14px 18px 0; }
  .pill.hot { background: {{ACCENT_COLOR}}; border-color: {{ACCENT_COLOR}}; color: #06281A; }
  .item-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 40px; max-width: 1500px; }
  .item { font-size: 38px; font-weight: 600; line-height: 1.35; }
  .item .sym { color: {{ACCENT_COLOR}}; margin-right: 14px; }
  .item .price { color: {{ACCENT_COLOR}}; font-weight: 800; }
  .step-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; max-width: 1640px; }
  .step { border: 2px solid rgba(255,255,255,0.16); border-radius: 20px; background: rgba(255,255,255,0.05); padding: 26px 24px; }
  .step .n { font-size: 44px; font-weight: 800; color: {{ACCENT_COLOR}}; }
  .step .t { font-size: 32px; font-weight: 700; line-height: 1.35; margin-top: 10px; }
  .footer { display: flex; align-items: center; justify-content: space-between; }
  .foot-main { font-size: 34px; font-weight: 700; color: {{ACCENT_COLOR}}; }
  .foot-side { font-size: 28px; font-weight: 600; color: rgba(255,255,255,0.6); }
</style>
</head>
<body>
<div class="slide">
  <div class="top">
    <div class="brand-row">
      <div class="brand-name">{{BRAND_NAME}}</div>
      <div class="kicker">{{KICKER}}</div>
    </div>
    <div class="rule"></div>
  </div>
  <div class="middle">
    <p class="headline">{{HEADLINE}}</p>
    <p class="subtext">{{SUBTEXT}}</p>
    <div class="body">{{BODY_HTML}}</div>
  </div>
  <div class="footer">
    <span class="foot-main">{{FOOTER_MAIN}}</span>
    <span class="foot-side">{{FOOTER_SIDE}}</span>
  </div>
</div>
<script>
(function() {
  var h = document.querySelector('.headline');
  if (h) {
    var len = (h.innerText || h.textContent || '').length;
    var size = 104;
    if (len > 40) size = 88;
    if (len > 60) size = 72;
    if (len > 90) size = 60;
    h.style.fontSize = size + 'px';
  }
})();
</script>
</body>
</html>
