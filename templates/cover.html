<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="brand_base.css">
<style>
  .slide-badge {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: 3px solid var(--brand-accent);
    color: var(--brand-accent);
    font-size: 32px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .headline {
    font-size: 96px;
    font-weight: 800;
    line-height: 1.1;
    color: var(--brand-text);
    margin: 0;
    max-width: 920px;
  }
  .subtext {
    font-size: 36px;
    line-height: 1.5;
    color: var(--brand-text-muted);
    max-width: 820px;
    margin: 40px 0 0 0;
  }
  .center-block {
    display: flex;
    flex-direction: column;
    justify-content: center;
    flex: 1;
  }
  .bottom-row {
    margin-top: 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .swipe-hint {
    font-size: 24px;
    color: var(--brand-text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="container">
  <div>
    <div class="brand-row">
      <div class="brand-name">{{BRAND}}</div>
      <div class="slide-badge">{{SLIDE_NUM}}</div>
    </div>
    <div class="brand-rule"></div>
  </div>
  <div class="center-block">
    <p class="headline">{{HEADLINE}}</p>
    <p class="subtext">{{SUBTEXT}}</p>
  </div>
  <div class="bottom-row">
    <span class="site-badge">{{WEBSITE}}</span>
    <span class="swipe-hint">Swipe</span>
  </div>
</div>
</body>
</html>
