<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="brand_base.css">
<style>
  .headline {
    font-size: 72px;
    font-weight: 800;
    line-height: 1.2;
    color: var(--brand-text);
    max-width: 900px;
    margin: 0;
  }
  .subtext {
    font-size: 32px;
    line-height: 1.5;
    color: var(--brand-text-muted);
    max-width: 800px;
    margin: 40px 0 0 0;
    font-weight: 400;
  }
  .center-block {
    display: flex;
    flex-direction: column;
    justify-content: center;
    flex: 1;
  }
  .bottom-row {
    margin-top: 40px;
  }
</style>
</head>
<body>
<div class="container">
  <div>
    <div class="brand-row">
      <div class="brand-name">{{BRAND}}</div>
    </div>
    <div class="brand-rule"></div>
  </div>
  <div class="center-block">
    <p class="headline">{{HEADLINE}}</p>
    <p class="subtext">{{SUBTEXT}}</p>
  </div>
  <div class="bottom-row">
    <span class="site-badge">{{WEBSITE}}</span>
  </div>
</div>
</body>
</html>
