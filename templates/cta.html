<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="brand_base.css">
<style>
  .headline {
    font-size: 72px;
    font-weight: 800;
    line-height: 1.2;
    color: var(--brand-text);
    margin: 0;
    max-width: 900px;
  }
  .subtext {
    font-size: 36px;
    line-height: 1.5;
    color: var(--brand-text-muted);
    max-width: 820px;
    margin: 36px 0 0 0;
  }
  .center-block {
    display: flex;
    flex-direction: column;
    justify-content: center;
    flex: 1;
  }
  .cta-button {
    display: inline-block;
    background: #FFFFFF;
    color: #0F172A;
    font-size: 32px;
    font-weight: 700;
    padding: 28px 48px;
    border-radius: 16px;
    margin-top: 20px;
  }
  .bottom-row {
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 20px;
  }
</style>
</head>
<body>
<div class="container">
  <div>
    <div class="brand-row">
      <div class="brand-name">{{BRAND}}</div>
    </div>
    <div class="brand-rule"></div>
  </div>
  <div class="center-block">
    <p class="headline">{{HEADLINE}}</p>
    <p class="subtext">{{SUBTEXT}}</p>
  </div>
  <div class="bottom-row">
    <span class="cta-button">WhatsApp: +91 99531 49058</span>
    <span class="site-badge">{{WEBSITE}}</span>
  </div>
</div>
</body>
</html>
